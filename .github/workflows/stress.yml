name: stress

on:
  # schedule:
  #     - cron: "0 0,8,16 * * *"
  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      src_repo:
        description: "Target FreeBSD Repository"
        default: "https://github.com/imrcpan/erofs-freebsd.git"
        required: true
        type: string
      src_branch:
        description: "Target FreeBSD Branch"
        default: "dev"
        required: true
        type: string
      utils_repo:
        description: "erofs-utils Git Repository"
        default: "git://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git"
        required: true
        type: string
      utils_branch:
        description: "erofs-utils Git Branch"
        default: "experimental"
        required: true
        type: string
      timeout:
        description: "Stress timeout"
        default: 7200
        required: true
        type: number
      stress-mkfs-options:
        description: "Customized mkfs options for stress testing"
        default: ""
        required: false
        type: string
      skip_world:
        description: Skip building the world, use the latest prebuilt one
        type: boolean
        default: true
      test_share:
        description: "Run share test"
        default: false
        required: true
        type: boolean

env:
  LZ4_VER: 1.10.0
  XZ_VER: 5.6.4
  SRC_REPO: ${{ github.event_name == 'schedule' && 'https://github.com/imrcpan/erofs-freebsd.git' || github.event.inputs.src_repo }}
  SRC_BRANCH: ${{ github.event_name == 'schedule' && 'dev' || github.event.inputs.src_branch }}
  UTILS_REPO: ${{ github.event_name == 'schedule' && 'git://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git' || github.event.inputs.utils_repo }}
  UTILS_BRANCH: ${{ github.event_name == 'schedule' && 'experimental' || github.event.inputs.utils_branch }}
  TIMEOUT: ${{ github.event_name == 'schedule' && 14400 || github.event.inputs.timeout }}
  SKIP_WORLD: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.skip_world }}
  BUNDLE: ${{ github.workspace }}/freebsd-built.tar.zst

defaults:
  run:
    shell: bash

jobs:
  build-erofs-utils:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suffix: ["", "_mt"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build erofs-utils
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y autoconf automake libtool pkg-config libfuse-dev libselinux1-dev libzstd-dev uuid-dev
          curl -L https://github.com/lz4/lz4/releases/download/v$LZ4_VER/lz4-$LZ4_VER.tar.gz | tar -zxv
          (cd lz4-$LZ4_VER; make BUILD_STATIC=no; sudo make install BUILD_STATIC=no)
          curl -L https://github.com/tukaani-project/xz/releases/download/v$XZ_VER/xz-$XZ_VER.tar.gz | tar -zxv
          (cd xz-$XZ_VER; ./configure; sudo make install)
          rm -rf erofs-utils; mkdir -p erofs-utils
          git clone $UTILS_REPO -b $UTILS_BRANCH erofs-utils
          cd erofs-utils
          MT="dis";[ "x${{ matrix.suffix }}" = "x_mt" ] && MT="en"
          mkdir output
          ./autogen.sh && ./configure --enable-debug --enable-werror --enable-fuse \
              --enable-lz4 --enable-lzma --with-selinux --with-libzstd \
              --${MT}able-multithreading \
              --prefix=$(pwd)/output && \
              make && make install
          cp -f contrib/stress output/bin
      - name: Upload erofs-utils
        uses: actions/upload-artifact@v7
        with:
          name: erofs-utils${{ matrix.suffix }}
          path: erofs-utils/output
          retention-days: 1

  build-freebsd:
    runs-on: ubuntu-latest
    steps:
      - name: Build FreeBSD kernel and world
        uses: imrcpan/freebsd-kernel-ci-tester@main
        with:
          src-repo: ${{ env.SRC_REPO }}
          src-branch: ${{ env.SRC_BRANCH }}
          kernconf: GENERIC
          skip-world: ${{ env.SKIP_WORLD }}
          export-image: ${{ env.BUNDLE }}
      - name: Hand the built system to the test jobs
        uses: actions/upload-artifact@v7
        with:
          name: freebsd-built
          path: ${{ env.BUNDLE }}
          retention-days: 1
          compression-level: 0

  stress-run:
    runs-on: ubuntu-latest
    needs: [build-freebsd, build-erofs-utils]
    strategy:
      matrix:
        alg: ["", "-zlz4", "-zlz4hc,12", "-zlzma,9", "-zdeflate", "-zzstd"]
        set: [0, 1]
        share: ${{ fromJSON(inputs.test_share && '[0, 1]' || '[0]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download erofs-utils prebuilts
        uses: actions/download-artifact@v8
        with:
          name: erofs-utils
      - name: Download FreeBSD prebuilts
        uses: actions/download-artifact@v8
        with:
          name: freebsd-built
          path: ${{ runner.temp }}/built
      - name: Stress prepare
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fuse
          chmod +x ./*
          chmod +x bin/mkfs.erofs bin/fsck.erofs bin/erofsfuse
          wget https://github.com/imrcpan/erofsstress-freebsd/releases/download/latest/golden.erofs
          mkdir mnt
          bin/erofsfuse golden.erofs mnt
          if [ "x${{ matrix.set }}" = "x1" ]; then
            if [ "x${{ matrix.alg }}" = "x" ]; then
              MKFS_OPTIONS="-Ededupe"
            else
              MKFS_OPTIONS="${{ github.event.inputs.stress-mkfs-options }}"
              [ "x$MKFS_OPTIONS" = "x" ] && MKFS_OPTIONS="-Ededupe,fragments,ztailpacking"
            fi
          else
              MKFS_OPTIONS=""
          fi
          seed=$((RANDOM * RANDOM))
          echo "random seed: $seed"
          if [ "x${{ matrix.share }}" = "x1" ]; then
            bin/mkfs.erofs ${{ matrix.alg }} $MKFS_OPTIONS --xattr-inode-digest=sha256.erofs.fingerprint testA.erofs mnt
            bin/mkfs.erofs --xattr-inode-digest=sha256.erofs.fingerprint testB.erofs mnt
            fusermount -u mnt; rm -rf mnt
            ./stress-arg-create $TIMEOUT $seed ${{ matrix.share }}
          else
            bin/mkfs.erofs ${{ matrix.alg }} $MKFS_OPTIONS testA.erofs mnt
            fusermount -u mnt; rm -rf mnt
            ./stress-arg-create $TIMEOUT $seed ${{ matrix.share }}
          fi
      - name: Stress run
        uses: imrcpan/freebsd-kernel-ci-tester@main
        with:
          image: ${{ runner.temp }}/built/freebsd-built.tar.zst
          mem: "8192"
          sync-dir: ${{ github.workspace }}
          run: |
            chmod +x ./*
            ./stress-run
